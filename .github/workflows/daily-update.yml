name: Daily SET data update

on:
  schedule:
    # ทุกวันจันทร์-ศุกร์ 11:00 UTC = 18:00 ICT (หลังตลาด SET ปิด 16:30)
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}   # กดรันเองได้จากแท็บ Actions บน GitHub

permissions:
  contents: write   # ต้องมีสิทธิ์ push กลับเข้า repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance --upgrade

      - name: Run update + build pipeline
        run: python scripts/update_and_build.py

      - name: Commit & push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          git diff --cached --quiet && echo "no changes" || git commit -m "auto: daily data update $(date -u +'%Y-%m-%d')"
          git push
