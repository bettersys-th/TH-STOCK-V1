name: Daily SET data update

on:
  schedule:
    # Monday-Friday, 11:00 UTC / 18:00 Asia/Bangkok (after SET closes).
    - cron: "0 11 * * 1-5"
  workflow_dispatch:
    inputs:
      upload_appwrite_staging:
        description: "Upload verified market data to Appwrite staging"
        required: false
        default: false
        type: boolean

# Deny permissions by default. Only the update job may write generated data.
permissions: {}

concurrency:
  group: daily-set-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A full Yahoo refresh plus the first 970-object staging upload can exceed 30 minutes.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.3.1

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Guard against committed secrets
        run: python scripts/security_guard.py

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: python -m unittest scripts/test_accumulation.py scripts/test_update_pipeline.py scripts/test_strategy_data.py scripts/test_cloud_export.py scripts/test_upload_appwrite.py

      - name: Run update and build pipeline
        run: python scripts/update_and_build.py
        env:
          # Optional independent checks. Configure only in GitHub Actions secrets.
          SET_API_KEY: ${{ secrets.SET_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}

      - name: Check Appwrite staging configuration
        id: appwrite
        if: github.event_name == 'workflow_dispatch' && inputs.upload_appwrite_staging
        shell: bash
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_MARKET_BUCKET_ID: ${{ secrets.APPWRITE_MARKET_BUCKET_ID }}
        run: |
          set -euo pipefail
          if [[ -n "$APPWRITE_ENDPOINT" && -n "$APPWRITE_PROJECT_ID" && -n "$APPWRITE_API_KEY" && -n "$APPWRITE_MARKET_BUCKET_ID" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Appwrite staging upload skipped: one or more secrets are not configured."
          fi

      - name: Install Appwrite uploader dependency
        if: github.event_name == 'workflow_dispatch' && inputs.upload_appwrite_staging && steps.appwrite.outputs.enabled == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-appwrite.txt

      - name: Upload verified market data to Appwrite staging
        if: github.event_name == 'workflow_dispatch' && inputs.upload_appwrite_staging && steps.appwrite.outputs.enabled == 'true'
        env:
          APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          APPWRITE_MARKET_BUCKET_ID: ${{ secrets.APPWRITE_MARKET_BUCKET_ID }}
        run: python scripts/upload_appwrite.py --apply

      - name: Commit and push updated data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: daily data update $(date -u +'%Y-%m-%d')"
            git push
          fi
